name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a queued deploy instead of racing it.
concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:vinext

      # Runtime secrets (SMTP, MongoDB, Google, Cloudinary) live on the Worker
      # itself and survive deploys; only the deploy credentials are needed here.
      - run: npm run deploy:vinext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
